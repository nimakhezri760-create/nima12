services:
  web:
    image: node:22-alpine
    working_dir: /site
    volumes:
      - ./site:/site
    ports:
      - "3000:3000"
    command: ["node", "server.mjs"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      base44.project: "Earthed"
      base44.kind: web
      base44.port: 3000
